name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Next version from last v* tag
        id: version
        run: |
          previous="$(git tag -l 'v*' --sort=-version:refname | head -n 1)"
          version="$(node -e '
            const [major, minor, patch] = process.argv[1].slice(1).split(".").map(Number);
            const next = { major: [major + 1, 0, 0], minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] };
            console.log(next[process.argv[2]].join("."));
          ' "$previous" "${{ inputs.bump }}")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists"
            exit 1
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write version and changelog
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git log "$PREVIOUS"..HEAD --no-merges --pretty='- %s' | grep -v '^- Release v' > notes.md || true
          [ -s notes.md ] || echo "- Maintenance release." > notes.md
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
            const released = git("for-each-ref", "refs/tags/v*", "--sort=-version:refname", "--format=%(objecttype) %(refname:short)")
              .split("\n").filter((line) => line.startsWith("tag ")).map((line) => line.slice(4));
            const entries = [`## ${process.env.VERSION}\n\n${fs.readFileSync("notes.md", "utf8").trim()}`];
            for (const tag of released) entries.push(`## ${tag.slice(1)}\n\n${git("tag", "-l", "--format=%(contents:body)", tag)}`);
            const history = fs.readFileSync("CHANGELOG.md", "utf8").replace(/^# Changelog\n+/, "");
            fs.writeFileSync("CHANGELOG.md", `# Changelog\n\n${entries.join("\n\n")}\n\n${history}`);
          '

      - run: npm run package

      - name: Tag release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION" -m "$(cat notes.md)"
          git push origin "v$VERSION"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --oidc --packagePath azalais-dark-theme.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" azalais-dark-theme.vsix --title "v$VERSION" --notes-file notes.md
